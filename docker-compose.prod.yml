services:
  db:
    image: postgres:16-alpine
    container_name: circlestore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    volumes:
      - circlestore_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: circlestore-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://marketplace:marketplace@db:5432/marketplace?schema=public
      FRONTEND_URL: https://circle.lightchan.online
      NODE_ENV: production
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    container_name: circlestore-web
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

  proxy:
    image: caddy:2-alpine
    container_name: circlestore-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - circlestore_caddy_data:/data
      - circlestore_caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  circlestore_db_data:
  circlestore_caddy_data:
  circlestore_caddy_config:
