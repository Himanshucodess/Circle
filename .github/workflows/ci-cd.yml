name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: circlestore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace?schema=public
      JWT_SECRET: ci-only-secret
      PORT: 4000
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build shared package
        run: npm run build -w @marketplace/shared

      - name: Apply test schema
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: ci
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.EC2_HOST }}
      DEPLOY_USER: ${{ secrets.EC2_USER }}
      DEPLOY_PATH: /home/ubuntu/circlestore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' '${{ secrets.EC2_SSH_KEY }}' > "$HOME/.ssh/circlestore.pem"
          chmod 600 "$HOME/.ssh/circlestore.pem"
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Check remote Docker
        run: >-
          ssh -i "$HOME/.ssh/circlestore.pem"
          "$DEPLOY_USER@$DEPLOY_HOST"
          'sudo docker version --format "{{.Server.Version}}"'

      - name: Transfer tracked source
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/circlestore.pem" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH'"
          git archive --format=tar.gz HEAD | ssh -i "$HOME/.ssh/circlestore.pem" \
            "$DEPLOY_USER@$DEPLOY_HOST" "tar -xzf - -C '$DEPLOY_PATH'"

      - name: Build and restart production stack
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/circlestore.pem" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && test -f .env && sudo docker compose -f docker-compose.prod.yml up -d --build --wait"

      - name: Migrate database
        run: |
          ssh -i "$HOME/.ssh/circlestore.pem" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && sudo docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy"

      - name: Verify deployment
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 5 \
            https://circle.lightchan.online/api/health
          ssh -i "$HOME/.ssh/circlestore.pem" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && sudo docker compose -f docker-compose.prod.yml ps"
